<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-src 'none'; connect-src 'none'">
  <title>Hydex ChatGPT approval</title>
  <link rel="stylesheet" href="approval.css">
  <script defer src="approval-page.js"></script>
</head>
<body>
  <main role="dialog" aria-modal="true" aria-labelledby="heading">
    <header><p class="eyebrow">CHATGPT CONVERSATION API</p><h1 id="heading">Review changes</h1></header>
    <section class="details" aria-label="Scrollable batch details" tabindex="0">
      <p id="description">Loading the exact batch…</p>
      <p id="caveat" class="caveat"></p>
      <pre id="batch"></pre>
    </section>
    <footer>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="cancel" disabled>Cancel</button>
        <button id="approve" class="primary" disabled>Approve this exact batch</button>
      </div>
    </footer>
  </main>
</body>
</html>
